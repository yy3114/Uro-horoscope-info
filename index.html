<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動物方城式 x 泌尿系統：Q彈多巴胺版</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        display: ['"Fredoka"', 'sans-serif'],
                    },
                    colors: {
                        'neon-purple': '#b026ff',
                        'neon-blue': '#4b7bec',
                        'neon-green': '#20bf6b',
                        'neon-pink': '#fa8231',
                    },
                    animation: {
                        'jelly': 'jelly 0.6s both',
                        'shimmer': 'shimmer 2s infinite linear',
                        'float': 'float 6s ease-in-out infinite',
                        'shockwave': 'shockwave 0.5s ease-out',
                    },
                    keyframes: {
                        // Q彈果凍動畫
                        'jelly': {
                            '0%': { transform: 'scale3d(1, 1, 1)' },
                            '30%': { transform: 'scale3d(1.25, 0.75, 1)' },
                            '40%': { transform: 'scale3d(0.75, 1.25, 1)' },
                            '50%': { transform: 'scale3d(1.15, 0.85, 1)' },
                            '65%': { transform: 'scale3d(0.95, 1.05, 1)' },
                            '75%': { transform: 'scale3d(1.05, 0.95, 1)' },
                            '100%': { transform: 'scale3d(1, 1, 1)' }
                        },
                        // 流光掃描動畫
                        'shimmer': {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        // 點擊波紋
                        'shockwave': {
                            '0%': { transform: 'scale(1)', opacity: '0.8', borderWidth: '4px' },
                            '100%': { transform: 'scale(2)', opacity: '0', borderWidth: '0px' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f1020;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 100%, hsla(225,39%,30%,1) 0, transparent 50%);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(30, 33, 58, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .locked {
            filter: grayscale(0.8) brightness(0.7);
            border: 2px dashed rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s;
        }
        .locked:hover {
            filter: grayscale(0) brightness(1);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-5px) rotate(2deg); /* 微旋轉 */
        }

        .unlocked {
            background: linear-gradient(135deg, rgba(32, 35, 60, 0.95) 0%, rgba(45, 48, 80, 0.95) 100%);
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
        }

        /* 漸層邊框效果 */
        .unlocked::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -2px;
            border-radius: inherit;
            background: linear-gradient(to right, #4b7bec, #b026ff, #20bf6b);
        }

        /* 流光遮罩 */
        .shimmer-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.1) 50%,
                rgba(255,255,255,0) 100%
            );
            transform: skewX(-20deg) translateX(-150%);
            pointer-events: none;
        }
        
        .card-shimmer-active .shimmer-mask {
            animation: shimmer 3s infinite;
        }

        .float-text {
            position: absolute;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 2px 0 #000;
            pointer-events: none;
            z-index: 100;
            animation: floatUpFade 1.2s ease-out forwards;
        }

        @keyframes floatUpFade {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-80px) scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="text-white min-h-screen pb-20">

    <!-- Header -->
    <div class="sticky top-0 z-50 glass-panel border-b border-white/10 pb-4 pt-4 px-4 sm:px-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-blue-500 to-purple-600 w-10 h-10 rounded-full flex items-center justify-center shadow-lg animate-bounce">
                    <i class="fa-solid fa-flask text-white"></i>
                </div>
                <h1 class="text-2xl font-black tracking-wide font-display bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">
                    ZOOTOPIA <span class="text-white text-base font-normal opacity-80">JELLY EDITION</span>
                </h1>
            </div>

            <div class="w-full sm:w-1/2 md:w-1/3">
                <div class="flex justify-between text-xs font-bold uppercase tracking-wider mb-1 text-blue-300">
                    <span>Collection Progress</span>
                    <span id="progress-text">0 / 10</span>
                </div>
                <div class="h-4 bg-gray-800 rounded-full overflow-hidden shadow-inner border border-white/5 relative">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-neon-blue via-neon-purple to-neon-pink w-0 transition-all duration-700 ease-out relative">
                        <div class="absolute inset-0 bg-white opacity-20 animate-pulse"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10">
        
        <div class="text-center mb-10">
            <h2 class="text-3xl sm:text-4xl font-bold mb-3 animate-float">
                點擊解鎖 (Jelly Click!) <i class="fa-solid fa-hand-pointer text-neon-pink text-2xl ml-2"></i>
            </h2>
            <p class="text-gray-400">感受每一次點擊的 Q 彈回饋！</p>
        </div>

        <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards -->
        </div>

        <div id="completion-message" class="hidden mt-12 text-center p-8 glass-panel rounded-3xl border-2 border-neon-green transform scale-90 transition-all duration-500">
            <div class="text-6xl mb-4 animate-bounce">🎉</div>
            <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-neon-green to-neon-blue mb-4">SYSTEM STABILIZED!</h2>
            <p class="text-xl text-white mb-6">恆定狀態完美達成！所有器官運作正常。</p>
            <button onclick="resetCollection()" class="px-8 py-3 bg-gradient-to-r from-neon-blue to-neon-purple rounded-full font-bold shadow-lg hover:scale-105 transition-transform">
                <i class="fa-solid fa-rotate-right mr-2"></i> 重置體驗 Replay
            </button>
        </div>
    </main>

    <!-- Details Modal -->
    <div id="detail-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative bg-gray-900 border border-white/20 rounded-3xl w-full max-w-lg p-1 overflow-hidden shadow-2xl transform transition-all scale-50 opacity-0 rotate-12" id="modal-content">
            <div id="modal-header-bg" class="h-24 w-full bg-gradient-to-r from-purple-600 to-blue-600 absolute top-0 left-0 z-0"></div>
            
            <div class="relative z-10 p-6 pt-10 text-center">
                <div class="mx-auto w-24 h-24 bg-gray-900 rounded-full border-4 border-white/20 flex items-center justify-center mb-4 shadow-xl -mt-6 animate-[jelly_1s_infinite]">
                    <span id="modal-emoji" class="text-5xl"></span>
                </div>

                <h3 id="modal-title" class="text-2xl font-bold text-white mb-1"></h3>
                <p id="modal-subtitle" class="text-neon-pink font-bold text-sm uppercase tracking-widest mb-6"></p>

                <div class="bg-gray-800/50 rounded-xl p-4 text-left border border-white/5 mb-4 hover:bg-gray-800 transition-colors">
                    <div class="flex items-center gap-2 mb-2 text-blue-300 font-bold">
                        <i class="fa-solid fa-microscope"></i> 生理對應
                    </div>
                    <p id="modal-organ" class="text-white text-lg font-bold mb-1"></p>
                    <p id="modal-function" class="text-gray-400 text-sm"></p>
                </div>

                <div class="bg-gray-800/50 rounded-xl p-4 text-left border border-white/5">
                    <div class="flex items-center gap-2 mb-2 text-yellow-300 font-bold">
                        <i class="fa-solid fa-lightbulb"></i> 聯想分析
                    </div>
                    <p id="modal-desc" class="text-gray-300 text-sm leading-relaxed"></p>
                </div>

                <button onclick="closeModal()" class="mt-6 w-full py-3 bg-white/10 hover:bg-white/20 rounded-xl font-bold transition-colors border border-white/10">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        const zootopiaData = [
             { id: 1, name: "茱蒂 (Judy)", role: "警局核心", organ: "腎元 (Nephron)", desc: "就像茱蒂是警局最勤奮的單位，腎元是腎臟工作的基本單位，日夜不休過濾血液、排除廢物（罪犯）。", emoji: "🐰", color: "from-blue-400 to-cyan-300", unlocked: false },
            { id: 2, name: "尼克 (Nick)", role: "狡猾交易", organ: "腎小管 (Renal Tubule)", desc: "腎小管很精明，把水和養分「贖回」（再吸收）到血液，丟掉廢物。就像尼克懂得在複雜社會中取捨生存。", emoji: "🦊", color: "from-orange-400 to-red-400", unlocked: false },
            { id: 3, name: "洪金豹 (Clawhauser)", role: "門面接待", organ: "腎絲球 (Glomerulus)", desc: "血液進入腎臟先經過圓圓的腎絲球，就像訪客要先過洪金豹這關。它擋住大分子，只讓水和小分子通過。", emoji: "🐆", color: "from-yellow-300 to-yellow-500", unlocked: false },
            { id: 4, name: "蠻牛局長 (Bogo)", role: "最後防線", organ: "外尿道括約肌", desc: "這是我們能用意念控制的「局長」。如果不批准（放鬆），誰都不准動（排尿）。他是系統最後的強硬把關者。", emoji: "🐃", color: "from-slate-600 to-slate-800", unlocked: false },
            { id: 5, name: "獅明德 (Lionheart)", role: "壓力容器", organ: "膀胱 (Bladder)", desc: "試圖把所有問題（尿液）都暫時「存」在自己肚子裡，維持表面和平，但壓力太大時可能會崩潰（失禁）。", emoji: "🦁", color: "from-amber-500 to-orange-600", unlocked: false },
            { id: 6, name: "楊咩咩 (Bellwether)", role: "幕後濃縮", organ: "亨利氏環 (Loop of Henle)", desc: "看起來是無害的細管子，卻利用逆流機制將尿液高度濃縮。就像她將城市中的毒素濃縮，製造高濃度混亂。", emoji: "🐑", color: "from-pink-300 to-pink-500", unlocked: false },
            { id: 7, name: "快俠 (Flash)", role: "緩慢輸送", organ: "輸尿管蠕動", desc: "尿液不是瀑布，而是靠平滑肌緩慢、節律性地蠕動推進。這種慢條斯理的節奏，就是快俠的風格。", emoji: "🦥", color: "from-green-400 to-emerald-600", unlocked: false },
            { id: 8, name: "B老大 (Mr. Big)", role: "極致控制", organ: "腎素-血管張力素 (RAAS)", desc: "腎素是微小的激素，卻能啟動 RAAS 系統控制全身血壓。就像 B 老大，個頭小卻掌握著城市的生死命脈。", emoji: "🐭", color: "from-red-600 to-rose-800", unlocked: false },
            { id: 9, name: "犀利哥 (Yax)", role: "自然釋放", organ: "排尿反射", desc: "當身體放鬆時，尿液自然排出。犀利哥代表這種「順應自然、毫無保留」的狀態，不強求憋著。", emoji: "🐂", color: "from-stone-500 to-stone-700", unlocked: false },
            { id: 10, name: "志羚姊姊 (Gazelle)", role: "完美平衡", organ: "體內恆定 (Homeostasis)", desc: "泌尿系統的終極目標。志羚姊姊象徵著那個不過酸、不過鹼、完美和諧的健康身體。", emoji: "🎤", color: "from-fuchsia-500 to-purple-600", unlocked: false }
        ];

        let unlockedCount = 0;
        const totalCount = zootopiaData.length;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Sound: Bouncy Jump Sound
        function playJumpSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.1); // Slide Up
            osc.frequency.linearRampToValueAtTime(400, now + 0.2); // Slide Down (Bounce)
            
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.2);
        }

        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            const notes = [440, 554, 659, 880]; // A Major
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, now + i*0.05);
                gain.gain.linearRampToValueAtTime(0.2, now + i*0.05 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.05 + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i*0.05);
                osc.stop(now + i*0.05 + 0.5);
            });
        }

        function renderCards() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            zootopiaData.forEach((item, index) => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                let classes = "relative rounded-2xl p-6 transition-all duration-300 select-none overflow-hidden ";
                
                if (item.unlocked) {
                    classes += "unlocked card-shimmer-active";
                } else {
                    classes += "glass-panel locked";
                }

                card.className = classes;
                card.onclick = () => handleCardClick(item.id, index);

                card.innerHTML = `
                    <div class="shimmer-mask"></div>
                    <div class="absolute top-2 right-2 text-xs font-mono text-white/30 z-10">#0${index + 1}</div>
                    <div class="flex flex-col items-center justify-center text-center h-full relative z-10">
                        <div class="text-6xl mb-4 transform transition-transform duration-300 ${item.unlocked ? 'scale-110' : 'scale-90 opacity-50'}">
                            ${item.emoji}
                        </div>
                        <h3 class="text-xl font-bold mb-1 ${item.unlocked ? 'text-white' : 'text-gray-400'}">${item.name}</h3>
                        <div class="h-px w-10 bg-white/20 my-2"></div>
                        <p class="text-sm font-semibold ${item.unlocked ? 'text-neon-blue' : 'text-gray-500'}">
                            ${item.unlocked ? item.organ : '??? (點擊解鎖)'}
                        </p>
                    </div>
                    ${item.unlocked ? '<div class="absolute bottom-2 right-2 text-neon-green"><i class="fa-solid fa-check-circle"></i></div>' : ''}
                `;
                container.appendChild(card);
            });
        }

        function handleCardClick(id, index) {
            const item = zootopiaData.find(d => d.id === id);
            
            if (item.unlocked) {
                showModal(item);
                return;
            }

            item.unlocked = true;
            unlockedCount++;
            
            // 1. Play Bounce Sound
            playJumpSound();

            // 2. Jelly Animation via Class
            const cardElement = document.getElementById(`card-${id}`);
            cardElement.classList.add('animate-jelly');
            
            // Remove class after animation to allow replay if needed (though card state changes)
            setTimeout(() => cardElement.classList.remove('animate-jelly'), 600);

            // 3. Floating Text
            showFloatingText(cardElement, "+ UNLOCKED");

            // 4. Star Burst Confetti (Explosion style)
            const rect = cardElement.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;

            confetti({
                particleCount: 50,
                spread: 100,
                origin: { x: x, y: y },
                shapes: ['star', 'circle'], // Stars!
                colors: ['#FFE15D', '#FF9F29', '#1CD6CE', '#F33535'],
                scalar: 1.2, // Bigger particles
                gravity: 0.6,
                decay: 0.9,
                startVelocity: 30,
                ticks: 200,
                zIndex: 200
            });

            // 5. Update UI
            updateProgress();
            renderCards(); 
            
            setTimeout(() => {
                showModal(item);
            }, 500);

            if (unlockedCount === totalCount) {
                setTimeout(triggerCompletion, 1000);
            }
        }

        function showFloatingText(element, text) {
            const float = document.createElement('div');
            float.innerText = text;
            float.className = 'float-text text-xl';
            
            const rect = element.getBoundingClientRect();
            float.style.left = `${rect.left + rect.width/2 - 40}px`;
            float.style.top = `${rect.top}px`;
            
            document.body.appendChild(float);
            setTimeout(() => float.remove(), 1200);
        }

        function updateProgress() {
            const percentage = (unlockedCount / totalCount) * 100;
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            
            bar.style.width = `${percentage}%`;
            text.innerText = `${unlockedCount} / ${totalCount}`;
        }

        function showModal(item) {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            
            document.getElementById('modal-emoji').innerText = item.emoji;
            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-subtitle').innerText = item.role;
            document.getElementById('modal-organ').innerText = item.organ;
            document.getElementById('modal-organ').className = `text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r ${item.color}`;
            document.getElementById('modal-function').innerText = item.role + "的功能對應"; 
            document.getElementById('modal-desc').innerText = item.desc;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Pop In Animation
            setTimeout(() => {
                content.classList.remove('scale-50', 'opacity-0', 'rotate-12');
                content.classList.add('scale-100', 'opacity-100', 'rotate-0');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            
            content.classList.remove('scale-100', 'opacity-100', 'rotate-0');
            content.classList.add('scale-50', 'opacity-0', 'rotate-12');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        function triggerCompletion() {
            playSuccessSound();
            const endMsg = document.getElementById('completion-message');
            endMsg.classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            // Fireworks Loop
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            var random = function(min, max) { return Math.random() * (max - min) + min; };

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);
              var particleCount = 50 * (timeLeft / duration);
              
              // Shoot from left and right
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.1, 0.3), y: Math.random() - 0.2 }, shapes: ['star'] }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: random(0.7, 0.9), y: Math.random() - 0.2 }, shapes: ['circle'] }));
            }, 250);
        }

        function resetCollection() {
            unlockedCount = 0;
            zootopiaData.forEach(item => item.unlocked = false);
            document.getElementById('completion-message').classList.add('hidden');
            updateProgress();
            renderCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
        });
    </script>
</body>
</html>
