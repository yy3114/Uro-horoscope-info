<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12生肖泌尿系統健康儀表板 (12/8 - 12/13)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f9ff; /* Light blue background */
            color: #1e293b;
        }
        .water-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
            border-left: 5px solid transparent;
        }
        .water-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.2);
        }
        /* Risk Levels */
        .risk-high { border-left-color: #ef4444; }
        .risk-med { border-left-color: #f59e0b; }
        .risk-low { border-left-color: #10b981; }

        /* Animation for water bubbles */
        @keyframes float {
            0% { transform: translateY(0px); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-20px); opacity: 0; }
        }
        .bubble {
            position: absolute;
            background: #bae6fd;
            border-radius: 50%;
            pointer-events: none;
        }
        
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

    <!-- Decorative Background Bubbles -->
    <div id="bubbles-container" class="fixed inset-0 z-0 pointer-events-none"></div>

    <!-- Header -->
    <header class="relative z-10 bg-white/80 backdrop-blur-md border-b border-sky-100 sticky top-0">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-4 md:mb-0">
                <div class="bg-sky-500 p-2 rounded-lg">
                    <i data-lucide="droplets" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-sky-900">泌尿系統健康儀表板</h1>
                    <p class="text-xs text-slate-500">2025/12/08 - 12/13 (戊子月)</p>
                </div>
            </div>
            
            <div class="flex space-x-2 text-sm">
                <div class="flex items-center px-3 py-1 bg-red-100 text-red-700 rounded-full">
                    <i data-lucide="alert-triangle" class="w-4 h-4 mr-1"></i>
                    <span>高風險: 馬、兔、羊</span>
                </div>
                <div class="flex items-center px-3 py-1 bg-sky-100 text-sky-700 rounded-full">
                    <i data-lucide="calendar" class="w-4 h-4 mr-1"></i>
                    <span>警戒日: 12/12 (五)</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Hydration Calculator -->
    <section class="relative z-10 container mx-auto px-4 py-8">
        <div class="bg-gradient-to-r from-sky-500 to-blue-600 rounded-2xl p-6 text-white shadow-xl max-w-4xl mx-auto mb-10">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="mb-6 md:mb-0">
                    <h2 class="text-xl font-bold mb-2 flex items-center">
                        <i data-lucide="cup-soda" class="mr-2"></i> 每日喝水目標計算機
                    </h2>
                    <p class="text-sky-100 text-sm">冬天容易忽略喝水，輸入體重計算您的基本需求。</p>
                </div>
                <div class="flex items-center space-x-4 bg-white/10 p-4 rounded-xl backdrop-blur-sm">
                    <input type="number" id="weight" placeholder="體重(kg)" class="bg-white/20 border border-white/30 rounded px-3 py-2 text-white placeholder-sky-200 focus:outline-none focus:ring-2 focus:ring-white w-24">
                    <button onclick="calculateWater()" class="bg-white text-sky-600 font-bold px-4 py-2 rounded hover:bg-sky-50 transition">計算</button>
                    <div class="text-right">
                        <div class="text-xs text-sky-100">建議攝取</div>
                        <div class="text-2xl font-bold" id="water-result">0 <span class="text-sm font-normal">ml</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Zodiac Grid -->
        <h3 class="text-xl font-bold text-slate-700 mb-6 flex items-center">
            <i data-lucide="activity" class="mr-2 text-sky-500"></i> 生肖健康診斷
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="zodiac-grid">
            <!-- Cards injected by JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="relative z-10 bg-slate-50 py-8 text-center text-slate-400 text-sm">
        <p>⚠️ 特別提醒：本週水氣旺盛，請勿憋尿。</p>
        <p class="mt-2">本資訊基於中醫命理五行推演，僅供參考，身體不適請務必就醫。</p>
    </footer>

    <script>
        // Init Icons
        lucide.createIcons();

        // Water Calculator
        function calculateWater() {
            const weight = document.getElementById('weight').value;
            if (weight > 0) {
                // Base calculation: Weight * 30 to 35ml. Using 35 for winter active metabolism.
                const water = Math.round(weight * 35);
                document.getElementById('water-result').innerHTML = `${water} <span class="text-sm font-normal">ml</span>`;
            }
        }

        // Generate Bubbles
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            for(let i=0; i<15; i++) {
                const b = document.createElement('div');
                b.className = 'bubble';
                b.style.left = Math.random() * 100 + '%';
                b.style.top = Math.random() * 100 + '%';
                b.style.width = (Math.random() * 20 + 10) + 'px';
                b.style.height = b.style.width;
                b.style.animation = `float ${Math.random() * 5 + 5}s infinite ease-in-out`;
                b.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(b);
            }
        }
        createBubbles();

        // Zodiac Data
        const zodiacHealth = [
            { id: 'rat', icon: '🐭', name: '鼠', risk: 'medium', riskText: '中度風險', title: '水氣過盛', desc: '本命月水氣太旺，易頻尿、水腫。精力消耗在代謝上。', tip: '睡前2小時少喝水，注意腰部保暖。', score: 70 },
            { id: 'ox', icon: '🐮', name: '牛', risk: 'low', riskText: '健康平穩', title: '過濾良好', desc: '土能納水，代謝功能穩定。六合護體，無大礙。', tip: '維持正常作息，多吃黑色食物（黑豆）養腎。', score: 90 },
            { id: 'tiger', icon: '🐯', name: '虎', risk: 'low', riskText: '代謝順暢', title: '水生木旺', desc: '水氣轉化為能量，排毒順暢。適合運動。', tip: '多做伸展運動，保持下半身循環。', score: 88 },
            { id: 'rabbit', icon: '🐰', name: '兔', risk: 'high', riskText: '高度警戒', title: '潛伏感染', desc: '子卯相刑（濕毒），易有細菌感染或私密處搔癢。', tip: '注意衛生，保持乾燥，少吃生冷海鮮。', score: 45 },
            { id: 'dragon', icon: '🐲', name: '龍', risk: 'medium', riskText: '需防積水', title: '水庫淤積', desc: '容易下半身水腫，或因久坐導致骨盆腔充血。', tip: '每小時起身走動，勿當沙發馬鈴薯。', score: 75 },
            { id: 'snake', icon: '🐍', name: '蛇', risk: 'medium', riskText: '循環變差', title: '寒氣入侵', desc: '火弱不敵水，易手腳冰冷、膀胱無力。', tip: '每晚熱水泡腳15分鐘，蓋過三陰交穴。', score: 65 },
            { id: 'horse', icon: '🐴', name: '馬', risk: 'high', riskText: '紅色警報', title: '發炎高危', desc: '子午相沖，水火不容。易患急性尿道炎、灼熱感。', tip: '絕對禁止憋尿！禁食辛辣油炸。', score: 30 },
            { id: 'goat', icon: '🐏', name: '羊', risk: 'high', riskText: '阻塞風險', title: '代謝受阻', desc: '子未相害，水道不通。易有結石感或排尿不順。', tip: '少喝濃茶咖啡，多做跳躍運動。', score: 40 },
            { id: 'monkey', icon: '🐵', name: '猴', risk: 'low', riskText: '活力充沛', title: '源遠流長', desc: '金生水，水源清澈。腎氣充足，功能運作佳。', tip: '適度補水即可，狀態良好。', score: 95 },
            { id: 'rooster', icon: '🐔', name: '雞', risk: 'low', riskText: '注意沈澱', title: '金水相生', desc: '整體不錯，但若喝水太少易有礦物質沈澱。', tip: '檸檬水是你的好朋友，幫助代謝。', score: 85 },
            { id: 'dog', icon: '🐶', name: '狗', risk: 'low', riskText: '平衡適中', title: '燥土制水', desc: '不易水腫，但容易因缺水導致便秘或尿液濃縮。', tip: '主動補充水分，不要等口渴才喝。', score: 82 },
            { id: 'pig', icon: '🐷', name: '豬', risk: 'medium', riskText: '濕氣較重', title: '同氣相求', desc: '體內濕氣重，易眼皮浮腫、身體沈重。', tip: '喝紅豆水或薏仁水去濕。', score: 72 }
        ];

        const grid = document.getElementById('zodiac-grid');
        
        zodiacHealth.forEach(z => {
            // Determine colors based on risk
            let riskClass = '';
            let riskBadgeClass = '';
            let progressColor = '';
            
            if(z.risk === 'high') {
                riskClass = 'risk-high';
                riskBadgeClass = 'bg-red-100 text-red-700 border-red-200';
                progressColor = 'bg-red-500';
            } else if (z.risk === 'medium') {
                riskClass = 'risk-med';
                riskBadgeClass = 'bg-amber-100 text-amber-700 border-amber-200';
                progressColor = 'bg-amber-400';
            } else {
                riskClass = 'risk-low';
                riskBadgeClass = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                progressColor = 'bg-emerald-500';
            }

            const card = document.createElement('div');
            card.className = `water-card p-6 ${riskClass}`;
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center">
                        <span class="text-4xl mr-3 bg-slate-100 rounded-full w-12 h-12 flex items-center justify-center">${z.icon}</span>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">${z.name}</h3>
                            <span class="text-xs px-2 py-0.5 rounded border ${riskBadgeClass}">${z.riskText}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-bold text-slate-700">${z.score}</div>
                        <div class="text-xs text-slate-400">健康分</div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="w-full bg-slate-200 rounded-full h-2 mb-1">
                        <div class="${progressColor} h-2 rounded-full" style="width: ${z.score}%"></div>
                    </div>
                </div>

                <div class="space-y-3">
                    <div>
                        <h4 class="font-bold text-slate-700 text-sm flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-stethoscope mr-1 w-4 h-4 text-sky-500"><path d="M4.8 2.3A.3.3 0 0 1 5 2h14a.3.3 0 0 1 .2.3v3.3a.3.3 0 0 1-.2.3L12 13.6 4 5.9a.3.3 0 0 1-.2-.3Z"/><path d="M12 13.6V20"/><path d="M8 20h8"/><path d="m5 17 2-2"/><path d="m19 17-2-2"/></svg>
                            ${z.title}
                        </h4>
                        <p class="text-xs text-slate-500 mt-1 leading-relaxed">${z.desc}</p>
                    </div>
                    
                    <div class="bg-sky-50 p-3 rounded-lg border border-sky-100">
                        <h4 class="font-bold text-sky-700 text-xs mb-1 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pill mr-1 w-3 h-3"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
                            保養處方
                        </h4>
                        <p class="text-xs text-sky-600">${z.tip}</p>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
